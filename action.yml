name: "Install generate-local-changelog"
description: "Install generate-local-changelog"
author: "Scott Doxey @neogeek"

runs:
  using: composite
  steps:
    - name: Setup Brew Path
      shell: bash
      run: echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

    - name: Install generate-local-changelog
      shell: bash
      run: |
        if ! command -v brew &>/dev/null && [ -f /home/linuxbrew/.linuxbrew/bin/brew ]; then
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        fi

        brew trust neogeek/generate-local-changelog
        brew tap neogeek/generate-local-changelog
        brew install generate-local-changelog

    - name: Print generate-local-changelog version
      shell: bash
      run: |
        generate-local-changelog --version
